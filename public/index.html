<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bored Wallboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
            --transition: 180ms ease;
        }

        /* ============================================================
           THEME: FLAT  (Windows-8 / Metro inspired — solid flat colors)
           ============================================================ */
        [data-theme="flat"] {
            --bg-page: #0c0c10;
            --bg-page-gradient: radial-gradient(circle at 15% 0%, #16161d 0%, #0c0c10 55%);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.5);
            --tile-radius: 4px;
            --tile-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            --tile-hover-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            --panel-bg: #1b1b22;
            --panel-border: #2c2c36;
            --accent: #2fb6e0;
            --success: #0f9d58; --success-fg: #ffffff;
            --warning: #f7630c; --warning-fg: #ffffff;
            --error: #e81123;   --error-fg: #ffffff;
            --info: #1f6fd6;    --info-fg: #ffffff;
        }

        /* ============================================================
           THEME: GLASS  (dark glassmorphism, blur + glow)
           ============================================================ */
        [data-theme="glass"] {
            --bg-page: #05070c;
            --bg-page-gradient:
                radial-gradient(circle at 8% 8%, #14203c 0%, transparent 45%),
                radial-gradient(circle at 92% 88%, #241338 0%, transparent 45%),
                #05070c;
            --text-primary: #f3f6ff;
            --text-secondary: rgba(243, 246, 255, 0.72);
            --text-muted: rgba(243, 246, 255, 0.45);
            --tile-radius: 18px;
            --tile-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            --tile-hover-shadow: 0 14px 42px rgba(0, 0, 0, 0.55);
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.12);
            --accent: #7dd3fc;
            --success: rgba(30, 210, 140, 0.16); --success-fg: #55e3ab; --success-glow: rgba(30, 210, 140, 0.35);
            --warning: rgba(255, 170, 0, 0.16);  --warning-fg: #ffbf5c; --warning-glow: rgba(255, 170, 0, 0.35);
            --error: rgba(255, 68, 68, 0.16);    --error-fg: #ff8686;  --error-glow: rgba(255, 68, 68, 0.35);
            --info: rgba(60, 170, 255, 0.16);    --info-fg: #6fd2ff;   --info-glow: rgba(60, 170, 255, 0.35);
        }

        /* ============================================================
           THEME: MINIMAL  (clean light, flat cards, left accent bar)
           ============================================================ */
        [data-theme="minimal"] {
            --bg-page: #eef0f4;
            --bg-page-gradient: #eef0f4;
            --text-primary: #14161c;
            --text-secondary: #4b4f5a;
            --text-muted: #8a8f9b;
            --tile-radius: 10px;
            --tile-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 4px rgba(16, 24, 40, 0.08);
            --tile-hover-shadow: 0 6px 18px rgba(16, 24, 40, 0.14);
            --panel-bg: #ffffff;
            --panel-border: #e3e5ea;
            --accent: #2e90fa;
            --success: #12b76a; --success-fg: #087443;
            --warning: #f79009; --warning-fg: #93450a;
            --error: #f04438;   --error-fg: #90211a;
            --info: #2e90fa;    --info-fg: #16549e;
        }

        /* ============================================================
           THEME: NEON  (cyberpunk glass — saturated glow, dark void)
           ============================================================ */
        [data-theme="neon"] {
            --bg-page: #05010c;
            --bg-page-gradient:
                radial-gradient(circle at 15% 20%, rgba(255, 0, 200, 0.14) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 255, 255, 0.14) 0%, transparent 40%),
                #05010c;
            --text-primary: #f2f2ff;
            --text-secondary: rgba(242, 242, 255, 0.75);
            --text-muted: rgba(242, 242, 255, 0.45);
            --tile-radius: 10px;
            --tile-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 8px 26px rgba(0, 0, 0, 0.55);
            --tile-hover-shadow: 0 0 26px rgba(255, 0, 220, 0.4), 0 12px 34px rgba(0, 0, 0, 0.6);
            --panel-bg: rgba(20, 8, 30, 0.55);
            --panel-border: rgba(255, 0, 220, 0.35);
            --accent: #ff2fd6;
            --success: rgba(0, 255, 170, 0.14); --success-fg: #37ffc0; --success-glow: rgba(0, 255, 170, 0.6);
            --warning: rgba(255, 230, 0, 0.14);  --warning-fg: #fff05c; --warning-glow: rgba(255, 230, 0, 0.55);
            --error: rgba(255, 0, 90, 0.14);    --error-fg: #ff5c8a;  --error-glow: rgba(255, 0, 90, 0.6);
            --info: rgba(0, 220, 255, 0.14);    --info-fg: #5ce6ff;   --info-glow: rgba(0, 220, 255, 0.6);
        }

        /* ============================================================
           THEME: SLATE  (corporate dark — muted cards, left accent)
           ============================================================ */
        [data-theme="slate"] {
            --bg-page: #161c26;
            --bg-page-gradient: #161c26;
            --text-primary: #e6e9ef;
            --text-secondary: #a7afbd;
            --text-muted: #6b7385;
            --tile-radius: 8px;
            --tile-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.25);
            --tile-hover-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            --panel-bg: #1f2733;
            --panel-border: #2c3648;
            --accent: #5b8def;
            --success: #2fae76; --success-fg: #2fae76;
            --warning: #d99a2b; --warning-fg: #d99a2b;
            --error: #d9524a;   --error-fg: #d9524a;
            --info: #5b8def;    --info-fg: #5b8def;
        }

        /* ============================================================
           THEME: HIGH CONTRAST  (accessibility — pure black/white/bold)
           ============================================================ */
        [data-theme="highcontrast"] {
            --bg-page: #000000;
            --bg-page-gradient: #000000;
            --text-primary: #ffffff;
            --text-secondary: #ffffff;
            --text-muted: #d0d0d0;
            --tile-radius: 2px;
            --tile-shadow: none;
            --tile-hover-shadow: 0 0 0 3px #ffffff;
            --panel-bg: #000000;
            --panel-border: #ffffff;
            --accent: #ffff00;
            --success: #00ff00; --success-fg: #000000;
            --warning: #ffbf00; --warning-fg: #000000;
            --error: #ff2b2b;   --error-fg: #000000;
            --info: #00baff;    --info-fg: #000000;
        }

        /* ============================================================
           THEME: SUNRISE  (warm gradient glass)
           ============================================================ */
        [data-theme="sunrise"] {
            --bg-page: #2b1055;
            --bg-page-gradient: linear-gradient(160deg, #2b1055 0%, #7f3b8f 35%, #e8735c 65%, #ffb86b 100%);
            --text-primary: #fff8f0;
            --text-secondary: rgba(255, 248, 240, 0.82);
            --text-muted: rgba(255, 248, 240, 0.58);
            --tile-radius: 16px;
            --tile-shadow: 0 8px 28px rgba(60, 20, 60, 0.35);
            --tile-hover-shadow: 0 14px 38px rgba(60, 20, 60, 0.45);
            --panel-bg: rgba(255, 255, 255, 0.14);
            --panel-border: rgba(255, 255, 255, 0.28);
            --accent: #ffd36e;
            --success: rgba(70, 220, 150, 0.24); --success-fg: #baffdf; --success-glow: rgba(70, 220, 150, 0.55);
            --warning: rgba(255, 190, 60, 0.26);  --warning-fg: #ffe3ab; --warning-glow: rgba(255, 190, 60, 0.6);
            --error: rgba(255, 90, 90, 0.26);    --error-fg: #ffc2c2;  --error-glow: rgba(255, 90, 90, 0.6);
            --info: rgba(120, 170, 255, 0.24);   --info-fg: #cfe0ff;   --info-glow: rgba(120, 170, 255, 0.55);
        }

        /* ============================================================
           THEME: RETRO  (green-phosphor terminal, scanlines, monospace)
           ============================================================ */
        [data-theme="retro"] {
            --font-family: 'Consolas', 'Courier New', monospace;
            --bg-page: #020402;
            --bg-page-gradient: #020402;
            --text-primary: #33ff66;
            --text-secondary: #29cc52;
            --text-muted: #1f9e3f;
            --tile-radius: 2px;
            --tile-shadow: none;
            --tile-hover-shadow: 0 0 14px rgba(51, 255, 102, 0.5);
            --panel-bg: #020402;
            --panel-border: #1f9e3f;
            --accent: #33ff66;
            --success: #33ff66;
            --warning: #ffd23f;
            --error: #ff4d4d;
            --info: #4de3ff;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-page-gradient);
            color: var(--text-primary);
            padding: 24px;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .header .hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* ---------- Flowing grid ---------- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            grid-auto-rows: 250px;
            grid-auto-flow: dense;
            gap: 20px;
            max-width: 1600px;
            margin: 30px auto 0;
        }

        .tile {
            grid-column: span 1;
            grid-row: span 1;
            height: 100%;
            width: 100%;
            border-radius: var(--tile-radius);
            box-shadow: var(--tile-shadow);
            padding: 18px 22px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .tile[data-size="2x1"] { grid-column: span 2; }
        .tile[data-size="1x2"] { grid-row: span 2; }
        .tile[data-size="2x2"] { grid-column: span 2; grid-row: span 2; }

        .tile[data-size="2x1"] .tile-value,
        .tile[data-size="1x2"] .tile-value { font-size: 3.4rem; }
        .tile[data-size="2x2"] .tile-value { font-size: 4.6rem; }

        .resize-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.65rem;
            padding: 3px 7px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.75);
            pointer-events: none;
        }
        [data-theme="minimal"] .resize-badge,
        [data-theme="highcontrast"] .resize-badge {
            background: rgba(0, 0, 0, 0.08);
            color: rgba(0, 0, 0, 0.55);
        }
        [data-theme="highcontrast"] .resize-badge {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        /* ---------- Flat-family tile fills (solid color): flat, high contrast ---------- */
        [data-theme="flat"] .tile.success,
        [data-theme="highcontrast"] .tile.success { background: var(--success); color: var(--success-fg); }
        [data-theme="flat"] .tile.warning,
        [data-theme="highcontrast"] .tile.warning { background: var(--warning); color: var(--warning-fg); }
        [data-theme="flat"] .tile.error,
        [data-theme="highcontrast"] .tile.error   { background: var(--error);   color: var(--error-fg); }
        [data-theme="flat"] .tile.info,
        [data-theme="highcontrast"] .tile.info    { background: var(--info);    color: var(--info-fg); }

        [data-theme="highcontrast"] .tile { border: 3px solid #ffffff; font-weight: 600; }

        /* ---------- Glass-family tile fills (translucent + glow): glass, neon, sunrise ---------- */
        [data-theme="glass"] .tile,
        [data-theme="neon"] .tile,
        [data-theme="sunrise"] .tile {
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
        }
        [data-theme="glass"] .tile.success, [data-theme="neon"] .tile.success, [data-theme="sunrise"] .tile.success { background: var(--success); box-shadow: 0 0 0 1px var(--success-glow), var(--tile-shadow); }
        [data-theme="glass"] .tile.warning, [data-theme="neon"] .tile.warning, [data-theme="sunrise"] .tile.warning { background: var(--warning); box-shadow: 0 0 0 1px var(--warning-glow), var(--tile-shadow); }
        [data-theme="glass"] .tile.error,   [data-theme="neon"] .tile.error,   [data-theme="sunrise"] .tile.error   { background: var(--error);   box-shadow: 0 0 0 1px var(--error-glow), var(--tile-shadow); }
        [data-theme="glass"] .tile.info,    [data-theme="neon"] .tile.info,    [data-theme="sunrise"] .tile.info    { background: var(--info);    box-shadow: 0 0 0 1px var(--info-glow), var(--tile-shadow); }

        /* ---------- Card-family tile fills (left accent bar): minimal, slate ---------- */
        [data-theme="minimal"] .tile,
        [data-theme="slate"] .tile {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-left: 4px solid var(--panel-border);
            color: var(--text-primary);
        }
        [data-theme="minimal"] .tile.success, [data-theme="slate"] .tile.success { border-left-color: var(--success); }
        [data-theme="minimal"] .tile.warning, [data-theme="slate"] .tile.warning { border-left-color: var(--warning); }
        [data-theme="minimal"] .tile.error,   [data-theme="slate"] .tile.error   { border-left-color: var(--error); }
        [data-theme="minimal"] .tile.info,    [data-theme="slate"] .tile.info    { border-left-color: var(--info); }

        /* ---------- Retro theme: green-phosphor terminal, outlined boxes, scanlines ---------- */
        [data-theme="retro"] .tile {
            background: #020402;
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
        }
        [data-theme="retro"] .tile.success { border-color: var(--success); color: var(--success); }
        [data-theme="retro"] .tile.warning { border-color: var(--warning); color: var(--warning); }
        [data-theme="retro"] .tile.error   { border-color: var(--error);   color: var(--error); }
        [data-theme="retro"] .tile.info    { border-color: var(--info);    color: var(--info); }
        [data-theme="retro"] .tile-value,
        [data-theme="retro"] .tile-title,
        [data-theme="retro"] .header h1 { text-shadow: 0 0 8px currentColor; }
        [data-theme="retro"] .tile-progress { background: rgba(51, 255, 102, 0.12); border: 1px solid var(--panel-border); }
        [data-theme="retro"] .progress-wheel-bg { stroke: rgba(51, 255, 102, 0.15); }
        [data-theme="retro"] body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0px, rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: overlay;
        }

        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tile-title {
            font-size: 1.05rem;
            font-weight: 600;
            opacity: 0.92;
        }

        .tile-icon {
            font-size: 1.5rem;
            opacity: 0.85;
        }

        .tile-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .tile-subtitle {
            font-size: 0.9rem;
            opacity: 0.75;
            margin-bottom: 15px;
        }

        .tile-progress {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        [data-theme="minimal"] .tile-progress { background: #eceef2; }

        .tile-progress-bar {
            height: 100%;
            background: currentColor;
            opacity: 0.85;
            border-radius: 3px;
        }

        .tile-footer {
            font-size: 0.8rem;
            opacity: 0.8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 4px 10px;
            margin-top: auto;
            padding-top: 10px;
            flex-shrink: 0;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: currentColor;
        }

        /* ---------- Progress wheel ---------- */
        .progress-wheel {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 10px auto;
            flex-shrink: 0;
        }

        .progress-wheel svg {
            transform: rotate(-90deg);
            width: 120px;
            height: 120px;
        }

        .progress-wheel-bg {
            fill: none;
            stroke: rgba(0, 0, 0, 0.2);
            stroke-width: 8;
        }
        [data-theme="minimal"] .progress-wheel-bg { stroke: #eceef2; }

        .progress-wheel-fill {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            stroke: currentColor;
        }

        .progress-wheel-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .progress-wheel-percentage {
            font-size: 1.5rem;
            font-weight: 700;
            display: block;
        }

        .progress-wheel-label {
            font-size: 0.7rem;
            opacity: 0.7;
            display: block;
            margin-top: 2px;
        }

        /* ---------- Loading / error / empty states ----------
           Note: uses .state-error (not .error) so it can never collide with
           a tile's status class, since tile elements get `class="tile error"`
           for error-status tiles. */
        .loading, .state-error, .no-tiles {
            text-align: center;
            padding: 40px;
            border-radius: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-secondary);
            max-width: 800px;
            margin: 20px auto;
        }

        .state-error { color: var(--error-fg, #ff6b6b); }
        .state-error h3 { margin-bottom: 15px; font-size: 1.5rem; font-weight: 500; }
        .error-icon { font-size: 3rem; margin-bottom: 15px; opacity: 0.8; }
        .state-error p { color: var(--text-secondary); margin-bottom: 10px; }
        .retry-info { color: var(--text-muted); font-size: 0.9rem; margin-top: 15px; font-style: italic; }

        .no-tiles-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.6; }
        .no-tiles h3 { margin-bottom: 15px; font-size: 1.8rem; font-weight: 500; color: var(--text-primary); }
        .no-tiles p { margin-bottom: 30px; font-size: 1.1rem; }

        .api-examples { text-align: left; margin-top: 30px; }
        .api-tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }

        .api-tab {
            background: var(--panel-border);
            color: var(--text-secondary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all var(--transition);
        }

        .api-tab.active { background: var(--accent); color: #ffffff; }
        .api-tab:hover { filter: brightness(1.15); }

        .api-content {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-primary);
            overflow-x: auto;
        }
        [data-theme="minimal"] .api-content { background: #f7f8fa; }

        .api-content h4 { color: var(--accent); margin-bottom: 15px; font-family: var(--font-family); font-size: 1rem; }
        .api-content pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
        .api-url { color: #ffaa00; }
        .api-json { color: #88ff88; }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }
            .tile { min-height: 220px; }
            .tile[data-size="2x1"],
            .tile[data-size="1x2"],
            .tile[data-size="2x2"] {
                grid-column: span 1;
                grid-row: span 1;
            }
            .header h1 { font-size: 2rem; }
        }

        .update-time {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .connection-status {
            position: fixed;
            top: 14px;
            right: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 10;
        }

        .connection-online { background: rgba(20, 160, 100, 0.18); color: #38d996; }
        .connection-offline { background: rgba(220, 60, 60, 0.18); color: #ff6a6a; }
        [data-theme="minimal"] .connection-online { background: #e7f9f1; color: #0a7a4d; }
        [data-theme="minimal"] .connection-offline { background: #fdeceb; color: #b3261e; }

        /* ---------- Theme switcher ---------- */
        .theme-switcher {
            position: fixed;
            top: 14px;
            left: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            z-index: 10;
            max-width: 360px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 5px;
            border-radius: 14px;
            box-shadow: var(--tile-shadow);
        }

        .theme-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }

        .theme-btn.active {
            background: var(--accent);
            color: #ffffff;
        }

        .theme-btn:hover:not(.active) {
            background: var(--panel-border);
        }
    </style>
</head>
<body>
    <div class="theme-switcher" id="themeSwitcher">
        <button class="theme-btn" data-theme-choice="flat">Flat</button>
        <button class="theme-btn" data-theme-choice="glass">Glass</button>
        <button class="theme-btn" data-theme-choice="minimal">Minimal</button>
        <button class="theme-btn" data-theme-choice="neon">Neon</button>
        <button class="theme-btn" data-theme-choice="slate">Slate</button>
        <button class="theme-btn" data-theme-choice="highcontrast">High Contrast</button>
        <button class="theme-btn" data-theme-choice="sunrise">Sunrise</button>
        <button class="theme-btn" data-theme-choice="retro">Retro</button>
    </div>

    <div class="connection-status" id="connectionStatus">
        🔄 Connecting...
    </div>

    <div class="header">
        <h1 id="dashboardTitle">Bored Wallboard</h1>
        <div class="hint">Double-click any tile to cycle its size (1x1 → 2x1 → 1x2 → 2x2)</div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="loading">
            <h3>Loading tiles...</h3>
            <p>Fetching latest data from server</p>
        </div>
    </div>

    <div class="update-time">
        Last updated: <span id="updateTime">Loading...</span>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.origin;
        const REFRESH_INTERVAL = 30000; // 30 seconds
        const SIZE_CYCLE = ['1x1', '2x1', '1x2', '2x2'];

        let lastUpdateTime = null;
        let connectionOnline = true;

        // ---------------- Theme handling ----------------
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('wallboardTheme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.themeChoice === theme);
            });
        }

        function initThemeSwitcher() {
            const saved = localStorage.getItem('wallboardTheme') || 'flat';
            applyTheme(saved);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => applyTheme(btn.dataset.themeChoice));
            });
        }

        // Update timestamp
        function updateTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent = now.toLocaleTimeString();
        }

        // Update connection status
        function updateConnectionStatus(online) {
            const statusEl = document.getElementById('connectionStatus');
            connectionOnline = online;

            if (online) {
                statusEl.textContent = '🟢 Online';
                statusEl.className = 'connection-status connection-online';
            } else {
                statusEl.textContent = '🔴 Offline';
                statusEl.className = 'connection-status connection-offline';
            }
        }

        // Resize a tile by cycling through the size list, persisted via API
        async function cycleTileSize(tileId, currentSize) {
            const idx = SIZE_CYCLE.indexOf(currentSize);
            const nextSize = SIZE_CYCLE[(idx + 1) % SIZE_CYCLE.length];

            try {
                const response = await fetch(`${API_BASE}/api/tiles/${encodeURIComponent(tileId)}/size`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ size: nextSize })
                });
                if (response.ok) {
                    loadTiles();
                }
            } catch (error) {
                console.error('Error resizing tile:', error);
            }
        }

        // Create tile element
        function createTile(tile) {
            const tileEl = document.createElement('div');
            tileEl.className = `tile ${tile.status}`;
            tileEl.dataset.tileId = tile.tile_id;
            const size = tile.size || '1x1';
            tileEl.setAttribute('data-size', size);
            tileEl.title = 'Double-click to resize';

            let content = '';

            if (tile.tile_type === 'progress_wheel') {
                const percentage = tile.max_value > 0 ? Math.round((tile.current_value / tile.max_value) * 100) : 0;
                const circumference = 2 * Math.PI * 50;
                const offset = circumference - (percentage / 100) * circumference;

                content = `
                    <span class="resize-badge">${size}</span>
                    <div class="tile-header">
                        <span class="tile-title">${tile.title}</span>
                        <span class="tile-icon">${tile.icon}</span>
                    </div>
                    <div class="progress-wheel">
                        <svg>
                            <circle class="progress-wheel-bg" cx="60" cy="60" r="50"></circle>
                            <circle class="progress-wheel-fill" cx="60" cy="60" r="50"
                                    stroke-dasharray="${circumference} ${circumference}"
                                    stroke-dashoffset="${offset}"></circle>
                        </svg>
                        <div class="progress-wheel-text">
                            <span class="progress-wheel-percentage">${percentage}%</span>
                            <span class="progress-wheel-label">${tile.sub_value}</span>
                        </div>
                    </div>
                    <div class="tile-footer">
                        <span><span class="status-indicator"></span>${tile.status_text}</span>
                        <span>${tile.additional_info}</span>
                    </div>
                `;
            } else if (tile.tile_type === 'progress_bar') {
                const percentage = tile.max_value > 0 ? Math.round((tile.current_value / tile.max_value) * 100) : 0;

                content = `
                    <span class="resize-badge">${size}</span>
                    <div class="tile-header">
                        <span class="tile-title">${tile.title}</span>
                        <span class="tile-icon">${tile.icon}</span>
                    </div>
                    <div class="tile-value">${tile.value}</div>
                    <div class="tile-subtitle">${tile.sub_value}</div>
                    <div class="tile-progress">
                        <div class="tile-progress-bar" style="width: ${percentage}%;"></div>
                    </div>
                    <div class="tile-footer">
                        <span><span class="status-indicator"></span>${tile.status_text}</span>
                        <span>${tile.additional_info}</span>
                    </div>
                `;
            } else {
                // Standard tile
                content = `
                    <span class="resize-badge">${size}</span>
                    <div class="tile-header">
                        <span class="tile-title">${tile.title}</span>
                        <span class="tile-icon">${tile.icon}</span>
                    </div>
                    <div class="tile-value">${tile.value}</div>
                    <div class="tile-subtitle">${tile.sub_value}</div>
                    <div class="tile-footer">
                        <span><span class="status-indicator"></span>${tile.status_text}</span>
                        <span>${tile.additional_info}</span>
                    </div>
                `;
            }

            tileEl.innerHTML = content;
            tileEl.addEventListener('dblclick', () => cycleTileSize(tile.tile_id, size));
            return tileEl;
        }

        // Fetch and render tiles
        async function loadTiles() {
            try {
                const response = await fetch(`${API_BASE}/api/tiles`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                updateConnectionStatus(true);

                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                if (data.tiles && data.tiles.length > 0) {
                    data.tiles.forEach(tile => {
                        const tileEl = createTile(tile);
                        dashboard.appendChild(tileEl);
                    });
                } else {
                    // Create no-tiles content using DOM to avoid template literal issues
                    const noTilesDiv = document.createElement('div');
                    noTilesDiv.className = 'no-tiles';

                    noTilesDiv.innerHTML =
                        '<div class="no-tiles-icon">📊</div>' +
                        '<h3>No tiles available</h3>' +
                        '<p>Your wallboard is ready! Add tiles using the API to start monitoring your systems.</p>' +
                        '<div class="api-examples">' +
                            '<div class="api-tabs">' +
                                '<button class="api-tab active" data-tab="curl">cURL</button>' +
                                '<button class="api-tab" data-tab="powershell">PowerShell</button>' +
                                '<button class="api-tab" data-tab="php">PHP</button>' +
                            '</div>' +
                            '<div id="curl-example" class="api-content">' +
                                '<h4>Add a tile with cURL:</h4>' +
                                '<pre><span class="api-url">curl -X POST http://localhost:3000/api/add</span> \\<br>' +
                                '  -H "Content-Type: application/json" \\<br>' +
                                '  -d <span class="api-json">\'{\n' +
                                '    "id": "server_cpu",\n' +
                                '    "title": "Server CPU Usage",\n' +
                                '    "icon": "💻",\n' +
                                '    "value": "75%",\n' +
                                '    "status": "warning",\n' +
                                '    "status_text": "Monitor",\n' +
                                '    "size": "2x1"\n' +
                                '  }\'</span></pre>' +
                            '</div>' +
                            '<div id="powershell-example" class="api-content" style="display: none;">' +
                                '<h4>Add a tile with PowerShell:</h4>' +
                                '<pre><span class="api-json">$body = @{\n' +
                                '    id = "network_status"\n' +
                                '    title = "Network Status"\n' +
                                '    icon = "🌐"\n' +
                                '    value = "Online"\n' +
                                '    status = "success"\n' +
                                '    status_text = "Healthy"\n' +
                                '    size = "1x1"\n' +
                                '} | ConvertTo-Json\n\n</span>' +
                                '<span class="api-url">Invoke-RestMethod -Uri "http://localhost:3000/api/add" `<br>' +
                                '  -Method POST `<br>' +
                                '  -ContentType "application/json" `<br>' +
                                '  -Body $body</span></pre>' +
                            '</div>' +
                            '<div id="php-example" class="api-content" style="display: none;">' +
                                '<h4>Add a tile with PHP:</h4>' +
                                '<pre><span class="api-json">$data = [\n' +
                                '    \'id\' => \'database_conn\',\n' +
                                '    \'title\' => \'Database Connections\',\n' +
                                '    \'icon\' => \'🗄️\',\n' +
                                '    \'value\' => \'24\',\n' +
                                '    \'status\' => \'info\',\n' +
                                '    \'status_text\' => \'Active\',\n' +
                                '    \'size\' => \'1x1\'\n' +
                                '];\n\n' +
                                '$json = json_encode($data);\n' +
                                '$context = stream_context_create([\n' +
                                '    \'http\' => [\n' +
                                '        \'method\' => \'POST\',\n' +
                                '        \'header\' => \'Content-Type: application/json\',\n' +
                                '        \'content\' => $json\n' +
                                '    ]\n' +
                                ']);\n\n</span>' +
                                '<span class="api-url">file_get_contents(\'http://localhost:3000/api/add\', false, $context);</span></pre>' +
                            '</div>' +
                        '</div>';

                    dashboard.appendChild(noTilesDiv);

                    // Initialize API tab functionality after content is loaded
                    initApiTabs();
                }

                lastUpdateTime = new Date();
                updateTime();

            } catch (error) {
                console.error('Error loading tiles:', error);
                updateConnectionStatus(false);

                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = `
                    <div class="state-error">
                        <div class="error-icon">🔌</div>
                        <h3>Connection Error</h3>
                        <p>Unable to connect to the wallboard server</p>
                        <div class="retry-info">Retrying automatically in ${REFRESH_INTERVAL / 1000} seconds...</div>
                    </div>
                `;
            }
        }

        // Load dashboard settings
        async function loadSettings() {
            try {
                const response = await fetch(`${API_BASE}/api/settings`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.settings && data.settings.dashboard_title) {
                        document.getElementById('dashboardTitle').textContent = data.settings.dashboard_title;
                        document.title = data.settings.dashboard_title;
                    }
                }
            } catch (error) {
                console.log('Could not load settings, using defaults');
            }
        }

        // Show API example tab
        function showApiExample(type) {
            document.querySelectorAll('.api-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.api-tab').forEach(el => el.classList.remove('active'));

            document.getElementById(type + '-example').style.display = 'block';

            document.querySelectorAll('.api-tab').forEach(el => {
                if (el.getAttribute('data-tab') === type) {
                    el.classList.add('active');
                }
            });
        }

        // Add event listeners for API tabs (done after content is loaded)
        function initApiTabs() {
            document.querySelectorAll('.api-tab').forEach(button => {
                button.addEventListener('click', function() {
                    const tabType = this.getAttribute('data-tab');
                    showApiExample(tabType);
                });
            });
        }

        // Initialize dashboard
        initThemeSwitcher();
        updateConnectionStatus(false);
        loadSettings();
        loadTiles();

        // Auto-refresh tiles
        setInterval(loadTiles, REFRESH_INTERVAL);

        // Update time display every second
        setInterval(updateTime, 1000);

        console.log('- Bored Wallboard loaded');
        console.log(`- Auto-refresh every ${REFRESH_INTERVAL / 1000} seconds`);
    </script>
</body>
</html>
